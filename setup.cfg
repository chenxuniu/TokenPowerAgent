[metadata]
name = tokenpoweragent
version = 0.1.0
description = Agentic multi-fidelity Pareto search for energy-efficient LLM inference
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tokenpoweragent = tokenpoweragent.cli:main

[options.extras_require]
dev =
    pytest>=8
yaml =
    PyYAML>=6
