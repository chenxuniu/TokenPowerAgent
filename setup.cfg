[metadata]
name = tokenpoweragent
version = 0.1.0
description = Agentic multi-fidelity discovery of verified LLM deployment profiles
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tokenpoweragent = tokenpoweragent.cli:main
    servecompass = tokenpoweragent.cli:main

[options.extras_require]
dev =
    pytest>=8
yaml =
    PyYAML>=6
