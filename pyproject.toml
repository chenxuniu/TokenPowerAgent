[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenpoweragent"
version = "0.1.0"
description = "Agentic multi-fidelity discovery of verified LLM deployment profiles"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "ServeCompass Authors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
yaml = ["PyYAML>=6"]

[project.scripts]
tokenpoweragent = "tokenpoweragent.cli:main"
servecompass = "tokenpoweragent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
